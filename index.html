<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Game Diary</title>
<link rel="manifest" href="manifest.webmanifest"/>
<meta name="theme-color" content="#1e3c72"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Game Diary"/>
<link rel="icon" href="icons/icon-192.png"/>
<link rel="apple-touch-icon" href="icons/icon-192.png"/>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
    /* --- Colourful/Gradient CSS --- */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #1e3c72, #2a5298);
        min-height: 100vh;
        color: #fff;
    }
    .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
    }
    .header {
        text-align: center;
        margin-bottom: 30px;
    }
    .header h1 {
        font-size: 2.5em;
        margin-bottom: 10px;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }
    .nav-bar {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
        flex-wrap: wrap;
    }
    .nav-btn, .btn {
        padding: 10px 20px;
        background: rgba(255,255,255,0.1);
        border: 2px solid rgba(255,255,255,0.2);
        border-radius: 8px;
        color: #fff;
        cursor: pointer;
        transition: all 0.3s ease;
        text-decoration: none;
        display: inline-block;
    }
    .nav-btn:hover, .btn:hover {
        background: rgba(255,255,255,0.2);
        border-color: rgba(255,255,255,0.4);
        transform: translateY(-2px);
    }
    .search-container {
        margin-bottom: 20px;
    }
    .search-input {
        width: 300px;
        padding: 10px;
        border-radius: 8px;
        border: none;
        background: rgba(255,255,255,0.9);
        color: #333;
        font-size: 16px;
    }
    .platforms-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
    }
    .platform-card {
        background: rgba(255,255,255,0.1);
        border-radius: 12px;
        padding: 20px;
        text-align: center;
        cursor: pointer;
        transition: all 0.3s ease;
        border: 2px solid rgba(255,255,255,0.2);
        position: relative;
        overflow: hidden;
        min-height: 200px;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
    }
    .platform-card:hover {
        background: rgba(255,255,255,0.2);
        transform: translateY(-5px);
        border-color: rgba(255,255,255,0.4);
    }
    .platform-icon {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 4em;
        background: rgba(255,255,255,0.05);
        border-radius: 10px;
        opacity: 0.3;
        transition: opacity 0.3s;
    }
    .platform-icon img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 10px;
    }
    .platform-icon.has-image {
        opacity: 0.4;
    }
    .platform-card:hover .platform-icon {
        opacity: 0.6;
    }
    .platform-card:hover .platform-icon.has-image {
        opacity: 0.7;
    }
    .platform-content {
        position: relative;
        z-index: 2;
        background: rgba(0,0,0,0.3);
        padding: 15px;
        border-radius: 8px;
        backdrop-filter: blur(2px);
    }
    .platform-icon-buttons {
        position: absolute;
        top: 10px;
        left: 10px;
        display: flex;
        gap: 4px;
        opacity: 0;
        transition: opacity 0.3s;
        z-index: 10;
    }
    .platform-card:hover .platform-icon-buttons {
        opacity: 1;
    }
    .platform-icon-buttons .icon-btn {
        width: 28px;
        height: 28px;
        min-width: 28px;
        min-height: 28px;
        max-width: 28px;
        max-height: 28px;
        padding: 0;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        background: rgba(255,255,255,0.95);
        border: 1px solid rgba(255,255,255,0.8);
        color: #333;
        cursor: pointer;
        position: relative;
        overflow: visible;
        transition: background 0.2s, box-shadow 0.2s;
    }
    .platform-icon-buttons .icon-btn .icon-label {
        display: none;
        position: absolute;
        left: 110%;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(0,0,0,0.85);
        color: #fff;
        padding: 3px 10px;
        border-radius: 6px;
        font-size: 12px;
        white-space: nowrap;
        z-index: 100;
        pointer-events: none;
    }
    .platform-icon-buttons .icon-btn:hover .icon-label {
        display: block;
    }
    .platform-icon-buttons .icon-btn:hover {
        background: #fff;
        box-shadow: 0 3px 6px rgba(0,0,0,0.3);
    }
    .platform-actions {
        position: absolute;
        top: 10px;
        right: 10px;
        opacity: 0;
        transition: opacity 0.3s;
        z-index: 10;
    }
    .platform-card:hover .platform-actions {
        opacity: 1;
    }
    .icon-btn.delete-btn {
        background: rgba(244,67,54,0.9);
        color: white;
        border-color: rgba(244,67,54,0.8);
    }
    .icon-btn.delete-btn:hover {
        background: rgba(244,67,54,1);
    }
    .platform-card h3 {
        font-size: 1.3em;
        margin-bottom: 8px;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    }
    .platform-card .game-count {
        color: rgba(255,255,255,0.9);
        font-size: 0.9em;
        text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
    }
    .games-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 20px;
    }
    .game-tile {
        background: rgba(255,255,255,0.1);
        border-radius: 12px;
        overflow: hidden;
        cursor: pointer;
        transition: all 0.3s ease;
        border: 2px solid rgba(255,255,255,0.2);
    }
    .game-tile.completed {
        border: 2px solid #ffd700;
        box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
    }
    .game-tile:hover {
        transform: translateY(-5px);
        background: rgba(255,255,255,0.2);
        border-color: rgba(255,255,255,0.4);
    }
    .game-tile.completed:hover {
        border-color: #ffd700;
        box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
    }
    .game-tile-image {
        width: 100%;
        height: 150px;
        background: rgba(0,0,0,0.3);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        color: #ccc;
        background-size: cover;
        background-position: center;
    }
    .game-tile-info {
        padding: 15px;
        text-align: center;
    }
    .game-tile-title {
        font-weight: bold;
        margin-bottom: 5px;
    }
    .game-tile-status {
        font-size: 0.9em;
        margin-bottom: 5px;
    }
    .rating {
        color: #ffd700;
    }
    .sort-bar {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-bottom: 15px;
        margin-top: 5px;
    }
    .sort-label {
        font-size: 1em;
        color: #fff;
        font-weight: bold;
    }
    .sort-select {
        padding: 6px 12px;
        border-radius: 6px;
        border: none;
        font-size: 1em;
        background: rgba(255,255,255,0.9);
        color: #333;
    }
    .form-container {
        background: rgba(255,255,255,0.1);
        border-radius: 12px;
        padding: 30px;
        margin-bottom: 20px;
    }
    .form-group {
        margin-bottom: 20px;
    }
    .form-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
    }
    .form-group input, .form-group select, .form-group textarea {
        width: 100%;
        padding: 10px;
        border-radius: 8px;
        border: none;
        background: rgba(255,255,255,0.9);
        color: #333;
        font-size: 16px;
    }
    .form-group textarea {
        min-height: 150px;
        resize: vertical;
    }
    .screenshots-container {
        border: 2px dashed rgba(255,255,255,0.3);
        border-radius: 8px;
        padding: 20px;
        text-align: center;
        margin-bottom: 20px;
        cursor: pointer;
        transition: all 0.3s ease;
    }
    .screenshots-container:hover {
        border-color: rgba(255,255,255,0.5);
        background: rgba(255,255,255,0.05);
    }
    .screenshots-container.dragover {
        border-color: #4CAF50;
        background: rgba(76, 175, 80, 0.1);
    }
    .screenshots-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 10px;
        margin-top: 15px;
    }
    .screenshot-item {
        position: relative;
        cursor: move;
        transition: all 0.3s ease;
    }
    .screenshot-item:hover {
        transform: scale(1.05);
    }
    .screenshot-item.dragging {
        opacity: 0.5;
        transform: rotate(5deg);
    }
    .screenshot-item img {
        width: 100%;
        height: 100px;
        object-fit: cover;
        border-radius: 8px;
        border: 2px solid rgba(255,255,255,0.2);
        transition: border-color 0.3s;
    }
    .screenshot-item.main-image img {
        border-color: #ffd700;
        box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
    }
    .screenshot-remove {
        position: absolute;
        top: 5px;
        right: 5px;
        background: rgba(255,0,0,0.8);
        color: white;
        border: none;
        border-radius: 50%;
        width: 25px;
        height: 25px;
        cursor: pointer;
        font-size: 12px;
        z-index: 2;
    }
    .screenshot-main {
        position: absolute;
        top: 5px;
        left: 5px;
        background: rgba(255, 215, 0, 0.9);
        color: #333;
        border: none;
        border-radius: 4px;
        padding: 2px 6px;
        cursor: pointer;
        font-size: 10px;
        font-weight: bold;
        z-index: 2;
    }
    .screenshot-main.active {
        background: #ffd700;
    }
    .screenshot-info {
        position: absolute;
        bottom: 2px;
        left: 2px;
        right: 2px;
        background: rgba(0,0,0,0.8);
        color: white;
        font-size: 9px;
        padding: 2px 4px;
        border-radius: 0 0 6px 6px;
        text-align: center;
    }
    .drag-hint {
        text-align: center;
        margin-top: 10px;
        font-size: 12px;
        color: rgba(255,255,255,0.6);
    }
    .rating-input {
        display: flex;
        gap: 5px;
        margin-top: 5px;
    }
    .star {
        font-size: 24px;
        color: #ddd;
        cursor: pointer;
        transition: color 0.2s;
    }
    .star:hover, .star.active {
        color: #ffd700;
    }
    .hidden {
        display: none;
    }
    .game-entry {
        background: rgba(255,255,255,0.1);
        border-radius: 12px;
        padding: 30px;
    }
    .game-entry h2 {
        margin-bottom: 20px;
        border-bottom: 2px solid rgba(255,255,255,0.2);
        padding-bottom: 10px;
    }
    .game-meta {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        margin-bottom: 20px;
        background: rgba(0,0,0,0.2);
        padding: 15px;
        border-radius: 8px;
    }
    .meta-item {
        display: flex;
        flex-direction: column;
    }
    .meta-label {
        font-weight: bold;
        color: #ccc;
        font-size: 0.9em;
        margin-bottom: 5px;
    }
    .meta-value {
        font-size: 1.1em;
    }
    .diary-content {
        line-height: 1.6;
        margin-bottom: 20px;
        white-space: pre-wrap;
    }
.entry-screenshots {
    display: grid;
    grid-template-columns: repeat(5, 200px); /* 5 columns, fixed width */
    gap: 15px;
    justify-content: start; /* Align items to the left */
    max-width: calc(5 * 200px + 4 * 15px); /* Prevent grid from stretching wider than 5 images */
}
.entry-screenshots img {
    width: 200px;
    height: 150px;
    object-fit: cover;
    border-radius: 8px;
    border: 2px solid rgba(255,255,255,0.2);
    cursor: pointer;
    transition: transform 0.3s;
}
    .entry-screenshots img:hover {
        transform: scale(1.05);
    }
    .add-platform {
        background: rgba(76, 175, 80, 0.2);
        border: 2px dashed rgba(76, 175, 80, 0.5);
    }
    .add-platform:hover {
        background: rgba(76, 175, 80, 0.3);
        border-color: rgba(76, 175, 80, 0.7);
    }
    .add-platform .platform-icon {
        opacity: 0.6;
        font-size: 3em;
    }
    .breadcrumb-nav {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-left: 20px;
    }
    .breadcrumb-item {
        color: rgba(255,255,255,0.8);
        cursor: pointer;
        padding: 5px 10px;
        border-radius: 4px;
        transition: all 0.3s ease;
    }
    .breadcrumb-item:hover {
        color: #fff;
        background: rgba(255,255,255,0.1);
    }
    .breadcrumb-item:last-child {
        color: #fff;
        cursor: default;
    }
    .breadcrumb-item:last-child:hover {
        background: none;
    }
    .breadcrumb-separator {
        color: rgba(255,255,255,0.5);
        font-size: 12px;
    }
    .progress-bar {
        width: 100%;
        height: 20px;
        background: rgba(255,255,255,0.2);
        border-radius: 10px;
        overflow: hidden;
        margin: 10px 0;
        display: none;
    }
    .progress-fill {
        height: 100%;
        background: linear-gradient(90deg, #4CAF50, #45a049);
        width: 0%;
        transition: width 0.3s ease;
    }
    .compression-stats {
        background: rgba(0,0,0,0.3);
        border-radius: 8px;
        padding: 15px;
        margin: 10px 0;
        font-size: 12px;
        color: rgba(255,255,255,0.8);
        display: none;
    }
    .progress-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.65);
        z-index: 1000;
        align-items: center;
        justify-content: center;
    }
    .progress-overlay-box {
        background: #2b2b3a;
        border: 1px solid rgba(255,255,255,0.15);
        border-radius: 12px;
        padding: 24px 28px;
        min-width: 300px;
        max-width: 90vw;
        box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    }
    .progress-overlay-title {
        color: #fff;
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 14px;
        text-align: center;
    }
    .progress-overlay-detail {
        color: rgba(255,255,255,0.75);
        font-size: 13px;
        margin-top: 10px;
        text-align: center;
        min-height: 16px;
    }
    .progress-overlay .progress-bar {
        display: block;
        margin: 0;
    }
    .progress-fill.indeterminate {
        width: 40% !important;
        animation: indeterminate-slide 1.1s ease-in-out infinite;
    }
    @keyframes indeterminate-slide {
        0% { margin-left: -40%; }
        100% { margin-left: 100%; }
    }
    @media (max-width: 768px) {
        .container {
            padding: 10px;
        }
        .search-input {
            width: 100%;
        }
        .games-grid {
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        }
    }
#backBtn {
    padding: 10px 20px;
    background: rgba(255,255,255,0.1);
    border: 2px solid rgba(255,255,255,0.2);
    border-radius: 8px;
    color: #fff;
    cursor: pointer;
    transition: all 0.3s ease;
    text-decoration: none;
    display: inline-block;
    margin-bottom: 15px;
}
#backBtn:hover {
    background: rgba(255,255,255,0.2);
    border-color: rgba(255,255,255,0.4);
    transform: translateY(-2px);
}
</style>
</head>
<body>
<div class="container">
<div class="progress-overlay" id="progressOverlay">
<div class="progress-overlay-box">
<div class="progress-overlay-title" id="progressOverlayTitle">Working…</div>
<div class="progress-bar" id="overlayProgressBar">
<div class="progress-fill" id="overlayProgressFill"></div>
</div>
<div class="progress-overlay-detail" id="progressOverlayDetail"></div>
</div>
</div>
<div class="header">
<h1>Game Diary</h1>
<div class="nav-bar">
<button class="nav-btn" onclick="showHome()">Home</button>
<button class="nav-btn" onclick="showAddGame()">Add Game</button>
<button class="nav-btn" onclick="exportData()">Export</button>
<button class="nav-btn" onclick="importData()">Import</button>
</div>
</div>
<div class="search-container">
<input class="search-input" id="searchInput" oninput="debouncedSearch()" placeholder="Search games or platforms..."/>
</div>
<button id="backBtn" onclick="goBack()" style="display:none;">← Back</button>
<div id="breadcrumbNav" style="display:none;">
<span id="breadcrumbPlatform" onclick="goToPlatform()"></span>
<span id="breadcrumbGameSep"> &gt; </span>
<span id="breadcrumbGame"></span>
</div>
<div id="homeView">
<div class="platforms-grid" id="platformsGrid"></div>
</div>
<div class="hidden" id="platformView">
<h2 id="platformTitle"></h2>
<div class="sort-bar" id="sortBar" style="display:none;">
    <span class="sort-label">Sort by:</span>
    <select class="sort-select" id="sortSelect">
        <option value="name">Name (A-Z)</option>
        <option value="nameDesc">Name (Z-A)</option>
        <option value="rating">Rating (High-Low)</option>
        <option value="ratingAsc">Rating (Low-High)</option>
        <option value="status">Status</option>
        <option value="year">Year (Newest)</option>
        <option value="yearAsc">Year (Oldest)</option>
    </select>
</div>
<div class="games-grid" id="gamesGrid"></div>
</div>
<div class="hidden" id="gameFormView">
<div class="form-container">
<h2 id="gameFormTitle">Add New Game</h2>
<form id="gameForm">
<div class="form-group form-actions-top"><button class="btn" type="submit">Save</button><button class="btn" onclick="cancelGameForm()" type="button">Cancel</button></div><div class="form-group">
<label for="gameName">Game Name *</label>
<input id="gameName" required="" type="text"/>
</div>
<div class="form-group">
<label for="gameYear">Year of Release</label>
<input id="gameYear" max="2030" min="1970" type="number"/>
</div>
<div class="form-group">
<label for="gamePlatform">Platform *</label>
<select id="gamePlatform" required=""></select>
</div>
<div class="form-group">
<label for="gameStatus">Status</label>
<select id="gameStatus">
<option value="Played">Played</option>
<option value="Completed">Completed</option>
<option value="Backlog">Backlog</option>
</select>
</div>
<div class="form-group">
<label>Rating</label>
<div class="stars">
<span class="star" onclick="setRating(1)">★</span>
<span class="star" onclick="setRating(2)">★</span>
<span class="star" onclick="setRating(3)">★</span>
<span class="star" onclick="setRating(4)">★</span>
<span class="star" onclick="setRating(5)">★</span>
</div>
<input id="gameRating" max="5" min="0" style="display:none;" type="number" value="0"/>
</div>
<div class="form-group">
<label for="gameDiary">Diary Entry</label>
<textarea id="gameDiary" placeholder="Diary"></textarea>
</div>
<div class="form-group">
<label>Screenshots</label>
<div class="screenshots-container" id="screenshotsContainer">
<div>📁 Drop images here or click to select</div>
<div style="font-size: 14px; color: rgba(255,255,255,0.7); margin-top: 5px;">
                                Any size supported - automatic compression applied
                            </div>
<input accept="image/*" id="fileInput" multiple="" style="display: none;" type="file"/>
<div class="progress-bar" id="progressBar">
<div class="progress-fill" id="progressFill"></div>
</div>
<div class="compression-stats" id="compressionStats"></div>
<div class="screenshots-grid" id="screenshotsGrid"></div>
</div>
</div>
<div class="form-group">
<button class="btn" type="submit">Save</button>
<button class="btn" onclick="cancelGameForm()" type="button">Cancel</button>
</div>
</form>
</div>
</div>
<div class="hidden" id="gameEntryView"><div style="margin-bottom:16px;"><button class="btn" onclick="editCurrentGame()">Edit</button><button class="btn" onclick="deleteCurrentGame()">Delete</button></div>
<div id="gameEntryContent"></div>
<div style="margin-top:16px;">
<button class="btn" onclick="editCurrentGame()">Edit</button>
<button class="btn" onclick="deleteCurrentGame()">Delete</button>
</div>
</div>
</div>
<script>
    // --- Improved Image Storage System ---
    class ImprovedImageStorage {
        constructor() {
            this.dbName = 'GameDiaryDB';
            this.dbVersion = 2;
            this.compressionOptions = {
                maxWidth: 1920,
                maxHeight: 1080,
                quality: 0.85,
                format: 'image/webp'
            };
        }

        async openDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(this.dbName, this.dbVersion);
                
                request.onupgradeneeded = (event) => {
                    const db = event.target.result;
                    
                    if (!db.objectStoreNames.contains('screenshots')) {
                        const screenshotStore = db.createObjectStore('screenshots', { 
                            keyPath: 'id', 
                            autoIncrement: true 
                        });
                        screenshotStore.createIndex('gameId', 'gameId', { unique: false });
                    }
                    
                    if (!db.objectStoreNames.contains('platformIcons')) {
                        db.createObjectStore('platformIcons', { 
                            keyPath: 'id', 
                            autoIncrement: true 
                        });
                    }
                };
                
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        async compressImage(file) {
            return new Promise((resolve) => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const img = new Image();
                
                img.onload = () => {
                    // Calculate new dimensions maintaining aspect ratio
                    let { width, height } = img;
                    const maxWidth = this.compressionOptions.maxWidth;
                    const maxHeight = this.compressionOptions.maxHeight;
                    
                    if (width > maxWidth || height > maxHeight) {
                        const ratio = Math.min(maxWidth / width, maxHeight / height);
                        width *= ratio;
                        height *= ratio;
                    }
                    
                    canvas.width = width;
                    canvas.height = height;
                    
                    // Use better image smoothing
                    ctx.imageSmoothingEnabled = true;
                    ctx.imageSmoothingQuality = 'high';
                    
                    // Draw and compress
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    canvas.toBlob((blob) => {
                        resolve({
                            blob,
                            originalSize: file.size,
                            compressedSize: blob.size,
                            compressionRatio: ((file.size - blob.size) / file.size * 100).toFixed(1),
                            dimensions: { width, height }
                        });
                    }, this.compressionOptions.format, this.compressionOptions.quality);
                };
                
                img.src = URL.createObjectURL(file);
            });
        }

        async saveBlob(storeName, file, metadata = {}) {
            const db = await this.openDB();
            const compressed = await this.compressImage(file);
            
            const data = {
                blob: compressed.blob,
                originalName: file.name,
                originalSize: compressed.originalSize,
                compressedSize: compressed.compressedSize,
                compressionRatio: compressed.compressionRatio,
                dimensions: compressed.dimensions,
                uploadDate: new Date().toISOString(),
                ...metadata
            };
            
            const transaction = db.transaction([storeName], 'readwrite');
            const store = transaction.objectStore(storeName);
            
            return new Promise((resolve, reject) => {
                const request = store.add(data);
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        async getBlob(storeName, id) {
            const db = await this.openDB();
            const transaction = db.transaction([storeName], 'readonly');
            const store = transaction.objectStore(storeName);
            
            return new Promise((resolve, reject) => {
                const request = store.get(id);
                request.onsuccess = () => {
                    const result = request.result;
                    resolve(result ? result.blob : null);
                };
                request.onerror = () => reject(request.error);
            });
        }

        async getBlobData(storeName, id) {
            const db = await this.openDB();
            const transaction = db.transaction([storeName], 'readonly');
            const store = transaction.objectStore(storeName);
            
            return new Promise((resolve, reject) => {
                const request = store.get(id);
                request.onsuccess = () => resolve(request.result || null);
                request.onerror = () => reject(request.error);
            });
        }

        formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }
    }

    async function renderGames() {
        const grid = document.getElementById('gamesGrid');
        grid.innerHTML = '';
        let platformGames = gameData.games.filter(game => game.platform === currentPlatform);

        // Sort logic
        switch (currentSort) {
            case 'name':
                platformGames.sort((a, b) => a.name.localeCompare(b.name));
                break;
            case 'nameDesc':
                platformGames.sort((a, b) => b.name.localeCompare(a.name));
                break;
            case 'rating':
                platformGames.sort((a, b) => b.rating - a.rating);
                break;
            case 'ratingAsc':
                platformGames.sort((a, b) => a.rating - b.rating);
                break;
            case 'status':
                platformGames.sort((a, b) => a.status.localeCompare(b.status));
                break;
            case 'year':
                platformGames.sort((a, b) => (parseInt(b.year) || 0) - (parseInt(a.year) || 0));
                break;
            case 'yearAsc':
                platformGames.sort((a, b) => (parseInt(a.year) || 0) - (parseInt(b.year) || 0));
                break;
        }

        if (platformGames.length === 0) {
            grid.innerHTML = '<div style="color:#fff;text-align:center;font-size:1.2em;grid-column:1/-1;">No games found.</div>';
            return;
        }

        for (const game of platformGames) {
            const tile = document.createElement('div');
            tile.className = 'game-tile';
            if (game.status === 'Completed' || game.status === 'Complete') {
                tile.classList.add('completed');

            tile.onclick = () => showGameEntry(game.id);
            const imageUrl = await getGameTileImage(game);
            const imageStyle = imageUrl ? `background-image: url(${imageUrl})` : '';
            tile.innerHTML = `
                <div class="game-tile-image" ${imageStyle ? `style="${imageStyle}"` : ''}>
                    ${!imageUrl ? 'No Image' : ''}

                    <div class="game-tile-status">${game.status}</div>
                    <div class="rating">${'★'.repeat(game.rating)}${'☆'.repeat(5-game.rating)}</div>
                </div>
            `;
            grid.appendChild(tile);
        }
    }

    // --- Enhanced Screenshot handling ---
    async function handleFileSelect(files) {
        const imageFiles = files.filter(file => file.type.startsWith('image/'));
        if (imageFiles.length === 0) return;
        
        await processFiles(imageFiles);
    }

    async function processFiles(files) {
        const total = files.length;
        let processed = 0;
        let totalOriginalSize = 0;
        let totalCompressedSize = 0;
        
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        progressBar.style.display = 'block';
        progressFill.style.width = '0%';
        
        for (const file of files) {
            try {
                // Check for duplicates by name and size
                let isDuplicate = false;
                for (const id of screenshots) {
                    const data = await imageStorage.getBlobData('screenshots', id);
                    if (data && data.originalName === file.name && data.originalSize === file.size) {
                        isDuplicate = true;
                        break;
                    }
                }
                
                if (!isDuplicate) {
                    const id = await imageStorage.saveBlob('screenshots', file);
                    const data = await imageStorage.getBlobData('screenshots', id);
                    screenshots.push(id);
                    totalOriginalSize += data.originalSize;
                    totalCompressedSize += data.compressedSize;
                }
                
                processed++;
                const progress = (processed / total) * 100;
                progressFill.style.width = progress + '%';
                
            } catch (error) {
                console.error('Error processing file:', error);
                processed++;
            }
        }
        
        progressBar.style.display = 'none';
        renderScreenshots();
        showCompressionStats(totalOriginalSize, totalCompressedSize);
    }

    function showCompressionStats(originalSize, compressedSize) {
        if (originalSize > 0) {
            const stats = document.getElementById('compressionStats');
            const savings = ((originalSize - compressedSize) / originalSize * 100).toFixed(1);
            stats.innerHTML = `
                📊 Processed: ${imageStorage.formatFileSize(originalSize)} → ${imageStorage.formatFileSize(compressedSize)} 
                💾 Saved: ${savings}% space
            `;
            stats.style.display = 'block';
        }
    }

    function removeScreenshot(index) {
        screenshots.splice(index, 1);
        if (mainImageIndex >= screenshots.length) {
            mainImageIndex = Math.max(0, screenshots.length - 1);
        } else if (index < mainImageIndex) {
            mainImageIndex--;
        } else if (index === mainImageIndex && screenshots.length > 0) {
            mainImageIndex = Math.min(mainImageIndex, screenshots.length - 1);
        }
        renderScreenshots();
    }

        document.getElementById('gamePlatform').value = game.platform;
        document.getElementById('gameStatus').value = game.status;
        document.getElementById('gameRating').value = game.rating;
        document.getElementById('gameDiary').value = game.diary || '';
        screenshots = [...(game.screenshots || [])];
        mainImageIndex = game.mainImageIndex || 0;
        updateRatingDisplay(game.rating);
        renderScreenshots();
        populatePlatformSelect();
        updateBreadcrumb();
    }
    function deleteCurrentGame() {
        const game = gameData.games.find(g => g.id === currentGameId);
        if (!game) return;
        const message = `Are you sure you want to delete "${game.name}"?\n\nThis will permanently remove:\n• The game entry\n• All diary text\n• All screenshots\n\nThis action cannot be undone.`;
        if (confirm(message)) {
            const gameIndex = gameData.games.findIndex(g => g.id === currentGameId);
            gameData.games.splice(gameIndex, 1);
            saveData();
            goBack();
        }
    }

    // --- Platform management ---
    function addNewPlatform() {
        const platformName = prompt('Enter new platform name:');
        if (platformName && !gameData.platforms.find(p => p.name === platformName)) {
            gameData.platforms.push({name: platformName, icon: null});
            saveData();
            renderPlatforms();
        }
    }
    async function changePlatformIcon(platformIndex) {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.onchange = async function(event) {
            const file = event.target.files[0];
            if (file) {
                try {
                    const id = await imageStorage.saveBlob('platformIcons', file);
                    gameData.platforms[platformIndex].icon = id;
                    if (saveData()) {
                        renderPlatforms();
                    }
                } catch (error) {
                    alert('Error uploading icon: ' + error.message);
                }
            }
        };
        input.click();
    }
    function removePlatformIcon(platformIndex) {
        if (confirm('Remove the icon for this platform?')) {
            gameData.platforms[platformIndex].icon = null;
            saveData();
            renderPlatforms();
        }
    }
    function deletePlatform(platformIndex) {
        const platform = gameData.platforms[platformIndex];
        const gameCount = gameData.games.filter(game => game.platform === platform.name).length;
        if (gameCount > 0) {
            alert(`Cannot delete platform "${platform.name}" because it contains ${gameCount} game${gameCount === 1 ? '' : 's'}.\n\nPlease delete or move all games from this platform first.`);
            return;
        }
        if (confirm(`Are you sure you want to delete the platform "${platform.name}"?\n\nThis action cannot be undone.`)) {
            gameData.platforms.splice(platformIndex, 1);
            saveData();
            renderPlatforms();
            if (currentPlatform === platform.name) {
                showHome();
            }
        }
    }

    // --- Search ---
    async function performSearch() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        if (!query) {
            if (currentView === 'platform') {
                renderGames();
            } else if (currentView === 'home') {
                renderPlatforms();
            }
            return;
        }

        // Always show platformView for search results
        hideAllViews();
        document.getElementById('platformView').classList.remove('hidden');
        document.getElementById('backBtn').style.display = 'inline-block';
        document.getElementById('platformTitle').textContent = `Search Results for "${query}"`;
        document.getElementById('sortBar').style.display = 'flex';
        currentView = 'platform';

        // Filter all games by name or platform
        let filteredGames = gameData.games.filter(game =>
            game.name.toLowerCase().includes(query) ||
            game.platform.toLowerCase().includes(query)
        );

        // Sort filtered games according to currentSort
        switch (currentSort) {
            case 'name':
                filteredGames.sort((a, b) => a.name.localeCompare(b.name));
                break;
            case 'nameDesc':
                filteredGames.sort((a, b) => b.name.localeCompare(a.name));
                break;
            case 'rating':
                filteredGames.sort((a, b) => b.rating - a.rating);
                break;
            case 'ratingAsc':
                filteredGames.sort((a, b) => a.rating - b.rating);
                break;
            case 'status':
                filteredGames.sort((a, b) => a.status.localeCompare(b.status));
                break;
            case 'year':
                filteredGames.sort((a, b) => (parseInt(b.year) || 0) - (parseInt(a.year) || 0));
                break;
            case 'yearAsc':
                filteredGames.sort((a, b) => (parseInt(a.year) || 0) - (parseInt(b.year) || 0));
                break;
        }

        // Render filtered games
        const grid = document.getElementById('gamesGrid');
        grid.innerHTML = '';
        if (filteredGames.length === 0) {
            grid.innerHTML = '<div style="color:#fff;text-align:center;font-size:1.2em;grid-column:1/-1;">No games found.</div>';
            return;
        }
        for (const game of filteredGames) {
            const tile = document.createElement('div');
            tile.className = 'game-tile';
            if (game.status === 'Completed' || game.status === 'Complete') {
                tile.classList.add('completed');
            }
            tile.onclick = () => showGameEntry(game.id);
            const imageUrl = await getGameTileImage(game);
            const imageStyle = imageUrl ? `background-image: url(${imageUrl})` : '';
            tile.innerHTML = `
                <div class="game-tile-image" ${imageStyle ? `style="${imageStyle}"` : ''}>
                    ${!imageUrl ? 'No Image' : ''}
                </div>
                <div class="game-tile-info">
                    <div class="game-tile-title">${game.name}</div>
                    <div class="game-tile-status">${game.status} - ${game.platform}</div>
                    <div class="rating">${'★'.repeat(game.rating)}${'☆'.repeat(5-game.rating)}</div>
                </div>
            `;
            grid.appendChild(tile);
        }
    }

    // --- Progress overlay (used by export/import for large backups) ---
    function showProgress(title) {
        document.getElementById('progressOverlayTitle').textContent = title;
        setIndeterminate(false);
        updateProgress(0, '');
        document.getElementById('progressOverlay').style.display = 'flex';
    }
    function updateProgress(percent, detail) {
        document.getElementById('overlayProgressFill').style.width =
            Math.max(0, Math.min(100, percent)) + '%';
        if (detail !== undefined) {
            document.getElementById('progressOverlayDetail').textContent = detail;
        }
    }
    function setIndeterminate(on) {
        document.getElementById('overlayProgressFill').classList.toggle('indeterminate', on);
    }
    function hideProgress() {
        document.getElementById('progressOverlay').style.display = 'none';
        setIndeterminate(false);
    }

    // --- Export/Import ---
    // NOTE: Export used to build one giant JSON string containing every screenshot
    // as a base64 data URL. Once enough screenshots piled up in IndexedDB, that
    // string exceeded the JS engine's maximum string length, causing
    // "Invalid string length". This version writes each image into a .zip as raw
    // binary (no base64 bloat, no giant string, plus zip compression), so it
    // scales to far more images.
async function exportData() {
    showProgress('Exporting backup…');
    try {
        if (typeof JSZip === 'undefined') {
            throw new Error('JSZip failed to load (check your internet connection) - cannot export.');
        }

        setIndeterminate(true);
        updateProgress(0, 'Reading screenshots from database…');

        const db = await imageStorage.openDB();

        // Fetch screenshot records (metadata + raw Blob, no base64 conversion)
        const screenshots = await new Promise((resolve, reject) => {
            const transaction = db.transaction(['screenshots'], 'readonly');
            const store = transaction.objectStore('screenshots');
            const request = store.getAll();
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error);
        });

        updateProgress(0, 'Reading platform icons from database…');

        // Fetch platform icon records (metadata + raw Blob)
        const platformIcons = await new Promise((resolve, reject) => {
            const transaction = db.transaction(['platformIcons'], 'readonly');
            const store = transaction.objectStore('platformIcons');
            const request = store.getAll();
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error);
        });

        setIndeterminate(false);
        updateProgress(0, `Packing ${screenshots.length + platformIcons.length} images…`);

        const zip = new JSZip();

        // Metadata only (blobs stripped out and stored as separate binary zip entries).
        // JSZip does NOT preserve a Blob's "type" (e.g. image/webp) through the zip
        // round-trip - extracted blobs come back with an empty type, which can stop
        // browsers rendering them as images. So we save each blob's mimeType here
        // and restore it manually on import.
        const screenshotsMeta = screenshots.map(({ blob, ...meta }) => ({ ...meta, mimeType: blob.type }));
        const platformIconsMeta = platformIcons.map(({ blob, ...meta }) => ({ ...meta, mimeType: blob.type }));

        zip.file('data.json', JSON.stringify({
            gameData,
            screenshotsMeta,
            platformIconsMeta
        }, null, 2));

        const shotsFolder = zip.folder('screenshots');
        for (const item of screenshots) {
            shotsFolder.file(String(item.id), item.blob);
        }

        const iconsFolder = zip.folder('platformIcons');
        for (const item of platformIcons) {
            iconsFolder.file(String(item.id), item.blob);
        }

        // JSZip reports real progress here via the onUpdate callback - this is
        // the slow step for large backups (reading + compressing every blob),
        // so this is where an accurate percentage actually matters most.
        const zipBlob = await zip.generateAsync(
            { type: 'blob', compression: 'DEFLATE', compressionOptions: { level: 6 } },
            (metadata) => {
                const pct = metadata.percent || 0;
                updateProgress(
                    pct,
                    `Compressing… ${pct.toFixed(0)}%${metadata.currentFile ? ' — ' + metadata.currentFile : ''}`
                );
            }
        );

        updateProgress(100, 'Starting download…');

        const url = URL.createObjectURL(zipBlob);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'game-diary-backup.zip';
        link.click();
        URL.revokeObjectURL(url);

        hideProgress();
    } catch (error) {
        hideProgress();
        alert('Error exporting data: ' + error.message);
        console.error(error);
    }
}

// Helper: convert Blob to Base64
function blobToBase64(blob) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
    });
}

async function importData() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.zip,.json';
    input.onchange = async function(event) {
        const file = event.target.files[0];
        if (!file) return;

        try {
            if (file.name.toLowerCase().endsWith('.zip')) {
                await importFromZip(file);
            } else {
                await importFromJson(file);
            }
        } catch (error) {
            hideProgress();
            alert('Error importing data: ' + error.message);
            console.error(error);
        }
    };
    input.click();
}

// Import from the new .zip backup format (raw binary images, no base64 string limits)
async function importFromZip(file) {
    showProgress('Importing backup…');
    if (typeof JSZip === 'undefined') {
        throw new Error('JSZip failed to load (check your internet connection) - cannot import.');
    }

    setIndeterminate(true);
    updateProgress(0, 'Reading archive…');

    // loadAsync only parses the zip's directory - it does not decompress
    // every file up front, so this step is fast even for large backups.
    const zip = await JSZip.loadAsync(file);
    const dataEntry = zip.file('data.json');
    if (!dataEntry) throw new Error('data.json not found in zip');

    const imported = JSON.parse(await dataEntry.async('string'));
    setIndeterminate(false);

    if (!confirm('This will replace all current data. Are you sure?')) {
        hideProgress();
        return;
    }

    // Read every blob out of the zip FIRST (this is the slow, async part -
    // each file is decompressed here) before opening the IndexedDB
    // transaction below, so that transaction never has to sit "open" while
    // waiting on unrelated async work.
    const screenshotMetas = imported.screenshotsMeta || [];
    const iconMetas = imported.platformIconsMeta || [];
    const totalFiles = screenshotMetas.length + iconMetas.length;
    let extracted = 0;

    const screenshotItems = [];
    for (const meta of screenshotMetas) {
        const entry = zip.file(`screenshots/${meta.id}`);
        if (entry) {
            const arrayBuffer = await entry.async('arraybuffer');
            const blob = new Blob([arrayBuffer], { type: meta.mimeType || 'image/webp' });
            screenshotItems.push({ ...meta, blob });
        } else {
            console.warn(`Import: screenshot ${meta.id} referenced but missing from zip`);
        }
        extracted++;
        updateProgress(totalFiles ? (extracted / totalFiles) * 60 : 60, `Extracting images… (${extracted}/${totalFiles})`);
    }

    const iconItems = [];
    for (const meta of iconMetas) {
        const entry = zip.file(`platformIcons/${meta.id}`);
        if (entry) {
            const arrayBuffer = await entry.async('arraybuffer');
            const blob = new Blob([arrayBuffer], { type: meta.mimeType || 'image/webp' });
            iconItems.push({ ...meta, blob });
        } else {
            console.warn(`Import: platform icon ${meta.id} referenced but missing from zip`);
        }
        extracted++;
        updateProgress(totalFiles ? (extracted / totalFiles) * 60 : 60, `Extracting images… (${extracted}/${totalFiles})`);
    }

    const db = await imageStorage.openDB();
    const totalWrites = screenshotItems.length + iconItems.length;
    let written = 0;
    updateProgress(60, `Writing to database… (0/${totalWrites})`);

    // Do the clear + all the writes as ONE transaction, and actually wait for
    // it to finish (oncomplete/onerror) before touching gameData or the UI.
    //
    // The previous version opened a brand-new transaction per screenshot and
    // never waited for any of them to complete before calling saveData() /
    // showHome(). That race is what caused screenshots to randomly go
    // missing after import: a write could still be in flight - or could
    // fail outright, silently, since there was no error handler - while the
    // app had already moved on to rendering games that referenced those ids.
    await new Promise((resolve, reject) => {
        const tx = db.transaction(['screenshots', 'platformIcons'], 'readwrite');
        const screenshotStore = tx.objectStore('screenshots');
        const iconStore = tx.objectStore('platformIcons');

        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
        tx.onabort = () => reject(tx.error || new Error('Import transaction was aborted'));

        const bumpWriteProgress = () => {
            written++;
            updateProgress(60 + (totalWrites ? (written / totalWrites) * 40 : 40), `Writing to database… (${written}/${totalWrites})`);
        };

        screenshotStore.clear();
        iconStore.clear();
        for (const item of screenshotItems) {
            screenshotStore.put(item).onsuccess = bumpWriteProgress;
        }
        for (const item of iconItems) {
            iconStore.put(item).onsuccess = bumpWriteProgress;
        }
    });

    gameData = imported.gameData;
    saveData();
    updateProgress(100, 'Done!');
    hideProgress();
    showHome();
    alert('Data imported successfully!');
}

// Import from the old .json backup format (base64 data URLs), kept for backward compatibility
async function importFromJson(file) {
    showProgress('Importing backup…');
    setIndeterminate(true);
    updateProgress(0, 'Reading backup file…');

    const text = await file.text();
    const imported = JSON.parse(text);
    setIndeterminate(false);

    if (!confirm('This will replace all current data. Are you sure?')) {
        hideProgress();
        return;
    }

    const rawShots = imported.screenshots || [];
    const rawIcons = imported.platformIcons || [];
    const totalItems = rawShots.length + rawIcons.length;
    let converted = 0;

    const screenshotItems = rawShots.map(shot => {
        const item = { ...shot, blob: dataURLtoBlob(shot.blob) };
        converted++;
        updateProgress(totalItems ? (converted / totalItems) * 60 : 60, `Decoding images… (${converted}/${totalItems})`);
        return item;
    });
    const iconItems = rawIcons.map(icon => {
        const item = { ...icon, blob: dataURLtoBlob(icon.blob) };
        converted++;
        updateProgress(totalItems ? (converted / totalItems) * 60 : 60, `Decoding images… (${converted}/${totalItems})`);
        return item;
    });

    const db = await imageStorage.openDB();
    const totalWrites = screenshotItems.length + iconItems.length;
    let written = 0;
    updateProgress(60, `Writing to database… (0/${totalWrites})`);

    // See importFromZip for why this is one transaction that we actually
    // wait on, instead of a separate un-awaited transaction per item.
    await new Promise((resolve, reject) => {
        const tx = db.transaction(['screenshots', 'platformIcons'], 'readwrite');
        const screenshotStore = tx.objectStore('screenshots');
        const iconStore = tx.objectStore('platformIcons');

        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
        tx.onabort = () => reject(tx.error || new Error('Import transaction was aborted'));

        const bumpWriteProgress = () => {
            written++;
            updateProgress(60 + (totalWrites ? (written / totalWrites) * 40 : 40), `Writing to database… (${written}/${totalWrites})`);
        };

        screenshotStore.clear();
        iconStore.clear();
        for (const item of screenshotItems) {
            screenshotStore.put(item).onsuccess = bumpWriteProgress;
        }
        for (const item of iconItems) {
            iconStore.put(item).onsuccess = bumpWriteProgress;
        }
    });

    gameData = imported.gameData;
    saveData();
    updateProgress(100, 'Done!');
    hideProgress();
    showHome();
    alert('Data imported successfully!');
}


// Helper: convert Base64 string back to Blob
function dataURLtoBlob(dataurl) {
    const arr = dataurl.split(',');
    const mime = arr[0].match(/:(.*?);/)[1];
    const bstr = atob(arr[1]);
    let n = bstr.length;
    const u8arr = new Uint8Array(n);
    while (n--) {
        u8arr[n] = bstr.charCodeAt(n);
    }
    return new Blob([u8arr], { type: mime });
}


// ---- PWA additions: offline support + persistent storage ----
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => console.warn('Service worker not registered:', err));
    });
}
if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persist().catch(() => {});
}
